<title>SMALLDESIRE 行銷島｜普普通通的分享一些好玩的作品</title>
<link rel="icon" href="中央島/smalldesire.jpg">

<style>
:root{
  --paper:#f7f9f8; --card:#ffffff; --ink:#1c3130; --muted:#5c706e; --line:#dae3e1;
  --peach:#e37f2a; --peach-soft:#faeedb; --teal:#2a7082; --teal-soft:#dceef2; --gold:#c98b1b; --gold-soft:#fbf2dd;
  --accent:#ff6452; --shadow:0 10px 30px rgba(20,40,40,.15);
  --f-display:"Huninn","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101a1a; --card:#182626; --ink:#e2eded; --muted:#9ab1ae; --line:#283d3b;
    --peach:#e89b4f; --peach-soft:#382b1b; --teal:#62b5c7; --teal-soft:#173138; --gold:#e2aa45; --gold-soft:#382e18;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101a1a; --card:#182626; --ink:#e2eded; --muted:#9ab1ae; --line:#283d3b;
  --peach:#e89b4f; --peach-soft:#382b1b; --teal:#62b5c7; --teal-soft:#173138; --gold:#e2aa45; --gold-soft:#382e18;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--peach);outline-offset:2px}
#stage{position:fixed;inset:0;background:#9dd3de}
#stage canvas{display:block;touch-action:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}

/* Brand Card */
.brand{
  top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));
  background:var(--card);border-radius:18px;padding:14px 18px 12px;box-shadow:var(--shadow);max-width:min(340px,calc(100vw - 28px));
  transition:all .25s ease;
}
.brand .brand-top{display:flex;align-items:center;gap:12px}
.brand .avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--peach);box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0}
.brand .title-wrap h1{margin:0;font-size:22px;line-height:1.2;font-family:var(--f-display);letter-spacing:.5px}
.brand .title-wrap p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .fold{position:absolute;top:10px;right:10px;width:28px;height:28px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:16px;line-height:1;display:grid;place-items:center}
.brand .links{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.brand .links a{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--teal-soft)}
.brand .links a.ig{background:#fde8ef;color:#d82d7e}
.brand .links a.th{background:#f0f0f2;color:#111}
.brand .links a.web{background:var(--peach-soft);color:var(--peach)}
.brand.min{padding:10px 14px}
.brand.min .links, .brand.min .title-wrap p{display:none}
.brand.min .avatar{width:32px;height:32px}
.brand.min .title-wrap h1{font-size:17px}

/* Time of day */
.tod{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.tod button{background:transparent;border:0;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.tod button.on{background:var(--peach);color:#fff}
.tod svg{width:16px;height:16px}

/* Tools */
.tools{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.tools button{background:var(--card);border:0;border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;justify-content:flex-start}
.tools button.on{background:var(--peach);color:#fff}
.tools svg{width:16px;height:16px;flex:0 0 auto}

/* Progress & Talk */
.progress{
  border:0;font:inherit;color:inherit;cursor:pointer;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--card);border-radius:999px;padding:6px 16px;box-shadow:var(--shadow);font-size:13.5px;font-weight:700;display:flex;gap:10px;align-items:center;white-space:nowrap;
}
.progress .badge{font-size:11.5px;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:1px 6px}
.talk{
  left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--peach);color:#fff;
  border:0;border-radius:999px;padding:10px 22px;font-weight:700;box-shadow:var(--shadow);font-size:15px;animation:bob 1.6s ease-in-out infinite;
}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.toast{
  left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--paper);
  border-radius:12px;padding:10px 18px;box-shadow:var(--shadow);font-size:14px;max-width:min(460px,calc(100vw - 32px));text-align:center;
}

/* Touch & Keyboard HUD */
#joy{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;background:color-mix(in srgb,var(--card) 70%,transparent);box-shadow:var(--shadow);touch-action:none}
#joy i{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:var(--teal);opacity:.9}
@media (hover:hover) and (pointer:fine){#joy{display:none}}
.keys{left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--card);border-radius:10px;padding:4px 10px;box-shadow:var(--shadow)}
@media (hover:none),(pointer:coarse){.keys{display:none}}

/* 3D Floating Labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.zl{
  position:absolute;transform:translate(-50%,-100%);background:var(--card);color:var(--ink);border-radius:12px;padding:4px 10px;
  font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.16);pointer-events:auto;cursor:pointer;border:0;
  transition:transform .15s ease, opacity .25s ease;
}
.zl:hover{transform:translate(-50%,-108%) scale(1.04)}
.zl b{color:var(--peach);font-weight:700;margin-right:5px;font-variant-numeric:tabular-nums}
.zl.isl{font-size:16px;padding:6px 14px;border-radius:14px;border:2px solid var(--peach);z-index:2}
.zl.isl b{font-size:17px}
.zl.center-isl{font-size:17px;padding:6px 16px;border-radius:14px;border:2.5px solid var(--gold);background:var(--card);color:var(--ink);z-index:2}
.zl.center-isl b{color:var(--gold)}
.zl.sub{font-size:12.5px;padding:4px 10px 4px 5px;border-radius:999px;background:color-mix(in srgb,var(--card) 92%,transparent)}
.zl.sub .no{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--peach);color:#fff;font-size:11px;font-weight:700;margin-right:5px;vertical-align:-2px}
.zl.sub.link-sub .no{background:var(--teal)}
.zl.sub.doorbell-sub{background:#fff3e0;border:1.5px solid #ff9800;color:#e65100;font-weight:700}
.zl.sub.doorbell-sub .no{background:#ff9800}
.zl.npc{background:var(--teal);color:#fff;font-size:12.5px;padding:3px 9px;border-radius:999px}
.zl.far{opacity:0;pointer-events:none}

/* Modal Bottom Sheet */
.sheet{
  animation:sheetUp .3s cubic-bezier(.2,.8,.2,1);position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:0;
  width:100%;max-width:580px;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);
  max-height:86vh;overflow-y:auto;padding:22px 24px 28px;
}
@media (min-width:1000px){
  .sheet{width:min(720px,calc(100vw - 420px));border-radius:24px;bottom:24px;max-height:82vh}
}
@keyframes sheetUp{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet .x{position:absolute;top:16px;right:18px;width:34px;height:34px;border:0;border-radius:50%;background:var(--paper);font-size:20px;display:grid;place-items:center;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--peach);text-transform:uppercase;margin-bottom:4px}
.sheet h2{margin:2px 0 8px;font-size:24px;line-height:1.3;font-family:var(--f-display)}
.sheet .sum{font-size:15px;color:var(--muted);margin:0 0 16px;line-height:1.6}
.sheet ul{padding-left:20px;margin:12px 0 18px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.sheet .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none}
.btn.pri{background:var(--peach);color:#fff;border-color:var(--peach)}
.btn.sec{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.btn.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.btn.doorbell{background:linear-gradient(135deg, #ff9800, #f57c00);color:#fff;border:none;box-shadow:0 4px 12px rgba(245,124,0,.3)}
.bubble{background:var(--paper);padding:14px 16px;border-radius:14px;margin:10px 0;font-size:14.5px;line-height:1.6;position:relative}
.fine{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}

/* Product list & Links */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:14px 0}
.prod-item{background:var(--paper);padding:12px 14px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.prod-item b{font-size:15px;color:var(--ink);display:flex;align-items:center;gap:6px}
.prod-item p{margin:6px 0 10px;font-size:13px;color:var(--muted);line-height:1.5}
.link-btn{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--paper);border-radius:14px;margin-bottom:8px;text-decoration:none;color:var(--ink);font-weight:700;border:1px solid var(--line)}
.link-btn:hover{border-color:var(--peach);background:var(--peach-soft)}

/* Stamps & Passport */
.stps{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:12px 0}
.stp{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:12px}
.stp.on{background:var(--peach-soft);border-color:var(--peach);color:var(--peach);font-weight:700}
.stp i{display:block;font-size:18px;font-style:normal;margin-bottom:2px}

/* Index sheet */
.idx{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.idx button{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;text-align:left}
.idx button b{font-size:16px;color:var(--peach);margin-right:10px}
.idx button span{flex:1;font-weight:700}

/* Intro Card */
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:18px}
.intro .card{background:var(--card);border-radius:24px;padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow)}
.intro .slogan{font-family:var(--f-display);font-size:22px;color:var(--peach);margin:10px 0 14px}
</style>
</head>

  try { localStorage.setItem("sdDone", JSON.stringify({ done: st.done, isl: st.isl, items: st.items, nick: st.nick })); } catch(e){}

const nItems = () => TRS.filter(t => st.items[t.id]).length;
const nStamps = () => ISL.filter(i => st.isl[i.id]).length + NPCS.filter(p => st.done[p.id]).length;
const STAMP_TOTAL = () => ISL.length + NPCS.length;
function nextHint() { const t = TRS.find(t => !st.items[t.id]); return t ? t.hint : null; }

function progress() {
  if ($("pTxt")) $("pTxt").textContent = `${nStamps()} / ${STAMP_TOTAL()}`;
  const ni = nItems();
  $("pBadge").hidden = !ni;
  if ($("pBadge")) $("pBadge").textContent = `寶物 ${ni}/4`;
  save();
}

let toastT;
function toast(t, ms = 2400) {
  const el = $("toast"); el.textContent = t; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, ms);
}

const sheet = $("sheet");
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ""; }
function openSheet(html) {
  sheet.hidden = false;
  sheet.innerHTML = `<button class="x" aria-label="關閉">×</button>` + html;
  sheet.scrollTop = 0;
  sheet.querySelector(".x").onclick = closeSheet;
}

  let html = `<article class="pc">
    <div class="eyebrow">${isl.id === "center" ? "BRAND HUB" : `第 ${isl.n} 島 · ${isl.name}`}</div>
    <h2>${c.t}</h2>

  if (isl.id === "product") {
    html += `<h3>精選 9 款趣味小品</h3><div class="prod-grid">
      ${isl.subs.map((s, idx) => `
        <div class="prod-item">
          <div>

            <p>${s[1]}</p>

          <a class="btn pri" style="padding:4px 8px;font-size:12px;text-decoration:none" href="https://smalldesire.com/" target="_blank" rel="noopener">前往官網體驗 ↗</a>

    html += `<h3>官方傳送門</h3><div>

        <a class="link-btn" href="${ch.url}" target="_blank" rel="noopener">

  } else if (isl.id === "feedback") {
    html += `<ul>${c.pts.map(p => `<li>${p}</li>`).join("")}</ul>
      <div style="background:#fff3e0;border-left:4px solid #ff9800;padding:12px 14px;border-radius:8px;margin:14px 0">

  const targetX = X.x;

/* ==========================================================================
   3. THREE.JS 3D WORLD & GENERATION
   ========================================================================== */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9dd3de);
scene.fog = new THREE.FogExp2(0x9dd3de, 0.007);

const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 800);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$("stage").appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x446655, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5ea, 1.25);
sun.position.set(-25, 45, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
scene.add(sun);

/* Helpers */
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 });
function box(w, h, d, c, x = 0, y = 0, z = 0, p = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === "number" ? mat(c) : c);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; p.add(m); return m;
}
function cyl(rt, rb, h, c, x = 0, y = 0, z = 0, p = scene, s = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s), typeof c === "number" ? mat(c) : c);
  m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; p.add(m); return m;
}
function sph(r, c, x = 0, y = 0, z = 0, p = scene, s = 14) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, s, s), typeof c === "number" ? mat(c) : c);
  // 正確放置球體：將球心定位在 y (若要底部接合地面則傳入 y+r)
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; p.add(m); return m;
}

/* Water */
const wg = new THREE.PlaneGeometry(600, 600, 60, 60);
const wpos = wg.attributes.position;
const wbase = Float32Array.from(wpos.array);
const water = new THREE.Mesh(wg, new THREE.MeshLambertMaterial({ color: 0x367f94, flatShading: true }));
water.rotation.x = -Math.PI / 2; water.position.y = -6; water.receiveShadow = true;
scene.add(water);

function waves(t) {
  for (let i = 0; i < wpos.count; i++) {
    const x = wbase[i * 3], y = wbase[i * 3 + 1];
    wpos.array[i * 3 + 2] = Math.sin(x * 0.08 + t * 0.9) * 0.35 + Math.cos(y * 0.1 + t * 1.1) * 0.3;
  }
  wpos.needsUpdate = true; wg.computeVertexNormals();
}

/* Islands & Honeycomb */
const HUBS = [], BRIDGES = [], COL = [];
const col = (x, z, r) => COL.push([x, z, r]);
const ISR = 10.5, GAP = 3.2, AP = ISR * Math.cos(Math.PI / 6), DD = 2 * AP + GAP;

const CELL = {
  center:   [0,  0],  // 中央島 (SMALLDESIRE)
  story:    [-1, 0],  // 故事島 (Left / West)
  product:  [1,  0],  // 產品島 (Right / East)
  link:     [0, -1],  // 連結島 (Top-Left / North)
  feedback: [0,  1]   // 意見島 (Bottom-Right / South)
};

const cellPos = ([q, r]) => [(q + r / 2) * DD, r * DD * Math.sin(Math.PI / 3)];
const ADJ = [
  ["center", "story"],
  ["center", "product"],
  ["center", "link"],
  ["center", "feedback"],
  ["story", "link"],
  ["product", "feedback"]
];

const ISLCOL = {
  center:   0xfffbf2, // 溫暖珍珠白
  story:    0xfbe8db, // 溫暖蜜桃橘
  product:  0xe4eff5, // 澄澈天藍
  link:     0xe8ebf5, // 現代雅青
  feedback: 0xe8f2ea  // 寧靜柔綠
};

function hexIsland(x, z, r, topColor) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  // Top grass cylinder (頂面正好在 y = 0)
  const topCyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.5, 6), mat(topColor));
  topCyl.position.y = -0.25; topCyl.receiveShadow = true; g.add(topCyl);
  // Beveled rims & cliff base
  cyl(r + 0.2, r + 0.2, 0.35, 0xc8dde2, 0, -0.65, 0, g, 6);
  cyl(r * 0.96, r * 0.78, 3.8, 0xd4c6a9, 0, -2.6, 0, g, 6);
  cyl(r * 0.78, r * 0.5, 1.8, 0xbaa889, 0, -5.2, 0, g, 6);
  const hub = { x, z, r, ap: r * Math.cos(Math.PI / 6), group: g };
  HUBS.push(hub); return hub;
}

/* 邊界判定改進：邊緣寬度放寬至 0.15，不卡腳 */
function inHex(h, x, z, m = 0.15) {
  const dx = x - h.x, dz = z - h.z;
  for (let k = 0; k < 6; k++) {
    const a = (30 + k * 60) * Math.PI / 180;
    if (dx * Math.sin(a) + dz * Math.cos(a) > h.ap - m) return false;
  }
  return true;
}

function segD(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz)));
  return Math.hypot(px - ax - t * dx, pz - az - t * dz);
}

function walkable(x, z) {
  return HUBS.some(h => inHex(h, x, z, 0.15)) || BRIDGES.some(b => segD(x, z, b.ax, b.az, b.bx, b.bz) < 1.4);
}

/* 橋樑高度計算：讓玩家在橋上走時能上下起伏，不陷進地板 */
function heightAt(x, z) {
  for (const b of BRIDGES) {
    const dx = x - b.ax, dz = z - b.az;
    const d = dx * b.ux + dz * b.uz;
    if (d <= b.s || d >= b.e) continue;
    const lat = Math.abs(-dx * b.uz + dz * b.ux);
    if (lat < 1.4) {
      return b.H * Math.sin(Math.PI * (d - b.s) / (b.e - b.s));
    }
  }
  return 0;
}

/* Bridges: 連接平滑無縫 */
function bridge(A, B) {
  const dx = B.x - A.x, dz = B.z - A.z, L = Math.hypot(dx, dz), ux = dx / L, uz = dz / L;
  const s = A.ap - 1.2, e = L - B.ap + 1.2, len = e - s, H = 0.85;
  const g = new THREE.Group(); g.position.set(A.x + ux * s, 0, A.z + uz * s);
  g.rotation.y = Math.atan2(ux, uz); scene.add(g);

  // 弧形橋面
  const N = 12;
  for (let i = 0; i < N; i++) {
    const t0 = i / N, t1 = (i + 1) / N;
    const z0 = t0 * len, z1 = t1 * len;
    const y0 = H * Math.sin(Math.PI * t0), y1 = H * Math.sin(Math.PI * t1);
    const zm = (z0 + z1) / 2, ym = (y0 + y1) / 2;
    const segL = Math.hypot(z1 - z0, y1 - y0);
    const ang = Math.atan2(y1 - y0, z1 - z0);

    const deck = box(2.4, 0.16, segL + 0.05, 0xdcc9a3, 0, ym - 0.08, zm, g);
    deck.rotation.x = -ang;

    [-1.25, 1.25].forEach(side => {
      const rail = box(0.12, 0.65, segL + 0.04, 0xa88a65, side, ym + 0.3, zm, g);
      rail.rotation.x = -ang;
      if (i % 3 === 0) {
        box(0.16, 0.75, 0.16, 0x8a6e4d, side, y0 + 0.3, z0, g);
      }
    });
  }

  // 橋頭燈
  [-1.25, 1.25].forEach(side => {
    cyl(0.05, 0.05, 1.3, 0x4a5560, side, 0.3, len * 0.25, g, 6);
    sph(0.18, 0xfff2b0, side, 1.7, len * 0.25, g);
    cyl(0.05, 0.05, 1.3, 0x4a5560, side, 0.3, len * 0.75, g, 6);
    sph(0.18, 0xfff2b0, side, 1.7, len * 0.75, g);
  });

  BRIDGES.push({ ax: A.x, az: A.z, bx: B.x, bz: B.z, ux, uz, s, e, H });
}

/* Build Islands */
const ISLX = {};
ISL.forEach(i => {
  const [x, z] = cellPos(CELL[i.id]);
  const hub = hexIsland(x, z, ISR, ISLCOL[i.id] || 0xfffbf2);
  ISLX[i.id] = { x, z, r: ISR, hub, i };
});

ADJ.forEach(([a, b]) => {
  if (ISLX[a] && ISLX[b]) bridge(ISLX[a].hub, ISLX[b].hub);
});

function C(X, deg, r) {
  const a = (deg - 30) * Math.PI / 180;
  return [X.x + Math.cos(a) * r, X.z + Math.sin(a) * r];
}

/* Tree & Foliage (根部坐落在 y = 0) */
function plantTree(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  cyl(0.16, 0.22, 1.3, 0x8a6a4f, 0, 0, 0, g, 8);
  sph(0.85, 0x62a85e, 0, 1.8, 0, g, 10);
  sph(0.65, 0x76bc70, 0, 2.45, 0, g, 10);
  col(x, z, 0.65);
}

// Perimeter trees
Object.values(ISLX).forEach(X => {
  for (let k = 0; k < 6; k++) {
    const [tx, tz] = C(X, k * 60 + 15, 8.6);
    if (!walkable(tx, tz)) plantTree(tx, tz);
  }
});

    const clock = cyl(0.32, 0.32, 0.08, 0x1c3130, 0, 1.35, 0, g, 16);

    box(0.32, 0.22, 0.55, 0xff3b30, -0.38, 0.08, 0.2, g);
    box(0.32, 0.22, 0.55, 0xf2b134, 0.38, 0.08, -0.2, g);

  // 7. 今天我是紅綠燈 (Traffic Light)
  g => {
    cyl(0.08, 0.08, 1.9, 0x3a4045, 0, 0, 0, g, 8);
    box(0.42, 0.95, 0.32, 0x222222, 0, 1.4, 0, g);

  g => {

    [[-0.2,0.15],[0.2,0.15],[-0.2,-0.15],[0.2,-0.15]].forEach(([x,z]) => cyl(0.07, 0.07, 0.3, 0xffffff, x, 0, z, shiba, 6));
    sph(0.45, 0xd88c42, 0, 0.5, 0, shiba); // Body
    sph(0.32, 0xd88c42, 0.42, 0.75, 0, shiba); // Head
    sph(0.2, 0xffffff, 0.48, 0.68, 0, shiba); // Muzzle
    box(0.12, 0.18, 0.08, 0xd88c42, 0.38, 1.0, -0.15, shiba).rotation.z = -0.3; // Ears
    box(0.12, 0.18, 0.08, 0xd88c42, 0.38, 1.0, 0.15, shiba).rotation.z = -0.3;

    ANIM.push(t => {

/* ==========================================================================
   5. LABELS SYSTEM (HUD)
   ========================================================================== */

const LAB = [];
const labelsEl = $("labels");
function addLabel(html, cls, anchor, onClick) {
  const b = document.createElement("button");
  b.className = "zl " + cls; b.innerHTML = html;
  if (onClick) b.onclick = onClick;
  labelsEl.appendChild(b);
  const o = { el: b, anchor, cls };
  LAB.push(o);
  return o;
}

    i.subs.forEach((s, k) => {

/* ==========================================================================
   6. PLAYER CHARACTER & SMOOTH CONTROLLER
   ========================================================================== */

function createPlayer() {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  cyl(0.22, 0.22, 0.5, 0x1c3130, -0.15, 0, 0, g, 8);
  cyl(0.22, 0.22, 0.5, 0x1c3130, 0.15, 0, 0, g, 8);
  const torso = cyl(0.42, 0.36, 0.9, st.look.shirt, 0, 0.45, 0, body, 12);
  torso.castShadow = true;
  const head = new THREE.Group(); head.position.y = 1.7; body.add(head);
  sph(0.36, 0xf6cfad, 0, 0, 0, head, 12);
  sph(0.05, 0x111111, -0.12, 0.05, 0.32, head);
  sph(0.05, 0x111111, 0.12, 0.05, 0.32, head);
  g.userData = { body, head, torso };
  scene.add(g);
  return g;
}

const player = createPlayer();
// 出生在中央島
player.position.set(ISLX.center.x, 0, ISLX.center.z);

window.applyLook = () => {
  if (player.userData.torso) player.userData.torso.material.color.setHex(st.look.shirt);
};

/* Controls */
const keys = {};
window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

let camPitch = 0.55, camYaw = 0, camDist = 22, sbMode = false;
window.setMode = m => {
  sbMode = m; st.overview = m;
  $("bOverview").classList.toggle("on", m);
  $("bOvLbl").textContent = m ? "漫遊" : "沙盤";
  toast(m ? "切換至全景沙盤模式（可自由拖曳鳥瞰）" : "切換至角色漫遊模式");
};

/* Pointer drag camera & click to move */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isDragging = false, dragStart = { x: 0, y: 0 };

window.addEventListener("pointerdown", e => {
  if (e.target.closest(".hud") || e.target.closest(".sheet") || e.target.closest(".zl") || e.target.closest("#doorbell-button")) return;
  isDragging = true; dragStart = { x: e.clientX, y: e.clientY };
});
window.addEventListener("pointermove", e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  dragStart = { x: e.clientX, y: e.clientY };
  camYaw += dx * 0.006;
  camPitch = Math.max(0.18, Math.min(1.35, camPitch - dy * 0.005));
});
window.addEventListener("pointerup", e => {
  if (!isDragging) return;
  isDragging = false;
  if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) < 6) {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, cam);
    const intersects = raycaster.intersectObjects([water, ...HUBS.map(h => h.group.children[0])]);
    if (intersects.length) {
      const p = intersects[0].point;
      if (walkable(p.x, p.z)) {
        st.auto = { target: new THREE.Vector3(p.x, heightAt(p.x, p.z), p.z) };
      }
    }
  }
});
window.addEventListener("wheel", e => {
  camDist = Math.max(8, Math.min(65, camDist + e.deltaY * 0.02));
});

/* Touch joystick */
let joyV = null;
const joy = $("joy"), knob = joy.querySelector("i");
function handleJoy(e) {
  const r = joy.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const L = Math.hypot(dx, dy), maxR = 40;
  const k = L > maxR ? maxR / L : 1;
  knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
  joyV = { x: (dx * k) / maxR, y: (dy * k) / maxR };
}
joy.addEventListener("pointerdown", e => { joy.setPointerCapture(e.pointerId); handleJoy(e); });
joy.addEventListener("pointermove", e => { if (joyV) handleJoy(e); });
const endJoy = () => { joyV = null; knob.style.transform = ""; };
joy.addEventListener("pointerup", endJoy); joy.addEventListener("pointercancel", endJoy);

/* Time of day */
const TOD = {
  dawn:  { bg: 0xffdfba, light: 0xffeedd, hemi: 0xffd1b3, int: 0.9 },
  day:   { bg: 0x9dd3de, light: 0xfff5ea, hemi: 0xffffff, int: 1.25 },
  dusk:  { bg: 0xf5a882, light: 0xff9966, hemi: 0xffaa88, int: 0.95 },
  night: { bg: 0x121e28, light: 0x7fa8d8, hemi: 0x223344, int: 0.5 }
};
document.querySelectorAll("#tod button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#tod button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    const t = TOD[b.dataset.t];
    scene.background.setHex(t.bg);
    scene.fog.color.setHex(t.bg);
    sun.color.setHex(t.light); sun.intensity = t.int;
    hemi.color.setHex(t.hemi);
  };
});

/* ==========================================================================
   7. MAIN LOOP & TICK (滑動防卡死與橋樑高度更新)
   ========================================================================== */

const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.getElapsedTime();
  waves(t);
  ANIM.forEach(fn => fn(t));

  // Player Movement input
  let moveX = 0, moveZ = 0;
  if (keys["w"] || keys["arrowup"]) moveZ -= 1;
  if (keys["s"] || keys["arrowdown"]) moveZ += 1;
  if (keys["a"] || keys["arrowleft"]) moveX -= 1;
  if (keys["d"] || keys["arrowright"]) moveX += 1;
  if (joyV) { moveX = joyV.x; moveZ = joyV.y; }

  // Auto path
  if (st.auto) {
    const dx = st.auto.target.x - player.position.x;
    const dz = st.auto.target.z - player.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 0.4) {
      if (st.auto.onDone) st.auto.onDone();
      st.auto = null;
    } else {
      moveX = dx / dist; moveZ = dz / dist;
    }
  }

  // 滑動碰撞防卡死 (Sliding Collision Avoidance)
  const isMoving = Math.hypot(moveX, moveZ) > 0.08;
  if (isMoving && !sbMode) {
    const sp = 9.5;
    const fwd = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    const dir = new THREE.Vector3().addScaledVector(right, moveX).addScaledVector(fwd, -moveZ).normalize();
    
    const vx = dir.x * sp * dt;
    const vz = dir.z * sp * dt;
    const nx = player.position.x + vx;
    const nz = player.position.z + vz;

    // 先嘗試同時移動 X 與 Z；若遇邊界則嘗試單軸滑動
    if (walkable(nx, nz)) {
      player.position.x = nx;
      player.position.z = nz;
    } else if (walkable(nx, player.position.z)) {
      player.position.x = nx;
    } else if (walkable(player.position.x, nz)) {
      player.position.z = nz;
    }

    // 垂直高度隨橋樑與島面平滑更新
    player.position.y = heightAt(player.position.x, player.position.z);

    const targetAngle = Math.atan2(dir.x, dir.z);
    player.rotation.y += (targetAngle - player.rotation.y) * 0.2;
    // 走路彈跳
    player.userData.body.position.y = Math.abs(Math.sin(t * 12)) * 0.12;
  } else {
    player.position.y = heightAt(player.position.x, player.position.z);
    player.userData.body.position.y = 0;
  }

  // Check NPC proximity
  let nearNpc = null;
  NPC_OBJS.forEach(n => {
    const d = player.position.distanceTo(n.pos);
    if (d < 3.2) nearNpc = n.p;
  });
  if (nearNpc && sheet.hidden) {
    $("talk").hidden = false;
    $("talk").textContent = `和 ${nearNpc.name} 聊聊 (E)`;
    $("talk").onclick = () => openTalk(nearNpc);
    if (keys["e"]) { keys["e"] = false; openTalk(nearNpc); }
  } else {
    $("talk").hidden = true;
  }

  // Camera Follow
  const px = player.position.x, pz = player.position.z, py = player.position.y;
  const targetCamDist = sbMode ? 52 : camDist;
  const targetCamPitch = sbMode ? 1.25 : camPitch;
  const cx = px + Math.sin(camYaw) * Math.cos(targetCamPitch) * targetCamDist;
  const cy = py + Math.sin(targetCamPitch) * targetCamDist + (sbMode ? 18 : 2.5);
  const cz = pz + Math.cos(camYaw) * Math.cos(targetCamPitch) * targetCamDist;
  cam.position.lerp(new THREE.Vector3(cx, cy, cz), 0.1);
  cam.lookAt(px, py + 1.2, pz);

  // Update 3D Floating Labels
  LAB.forEach(l => {
    const p = l.anchor.clone().project(cam);
    const inFront = p.z < 1;
    const sx = (p.x * 0.5 + 0.5) * innerWidth;
    const sy = (-p.y * 0.5 + 0.5) * innerHeight;
    l.el.style.left = `${sx}px`;
    l.el.style.top = `${sy}px`;
    const distToCam = cam.position.distanceTo(l.anchor);
    const visible = inFront && (sbMode ? distToCam < 95 : distToCam < 65);
    l.el.classList.toggle("far", !visible);
  });

  renderer.render(scene, cam);
}

window.addEventListener("resize", () => {
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Start
progress();
intro();
tick();
